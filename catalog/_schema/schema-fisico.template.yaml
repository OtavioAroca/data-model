# yaml-language-server: $schema=./schema-fisico.schema.json
# Template: copie este arquivo para catalog/<slug>/schema-fisico/schema-fisico.yaml e adapte

tabelas:
  # Exemplo: tabela Bronze (eventos raw)
  - nome: bronze.exemplo__evento
    camada_medalhao: Bronze
    colunas:
      - nome: event_id
        tipo: TEXT
        nullable: false
        chave_primaria: true
        descricao: Identificador único do evento

      - nome: entity_id
        tipo: TEXT
        nullable: false
        descricao: ID da entidade principal (ex: purchase_id, account_id)

      - nome: event_type
        tipo: TEXT
        nullable: false
        descricao: Tipo do evento (ex: approved, denied, cancelled)

      - nome: event_timestamp
        tipo: TEXT
        nullable: false
        descricao: Timestamp ISO 8601 do evento

      - nome: metadata
        tipo: TEXT
        nullable: true
        descricao: Dados extras em JSON (opcional)

      - nome: ingest_timestamp
        tipo: TEXT
        nullable: false
        descricao: Timestamp de ingestão no data lake

  # Exemplo: tabela Silver L1 (histórico de eventos)
  - nome: silver_l1.exemplo__entidade
    camada_medalhao: Silver L1
    colunas:
      - nome: entity_id
        tipo: TEXT
        nullable: false
        descricao: ID da entidade (chave de agrupamento)

      - nome: event_sequence
        tipo: INTEGER
        nullable: false
        descricao: Sequência do evento (1, 2, 3...)

      - nome: event_type
        tipo: TEXT
        nullable: false
        descricao: Tipo do evento

      - nome: event_timestamp
        tipo: TEXT
        nullable: false
        descricao: Timestamp do evento

      - nome: processed_timestamp
        tipo: TEXT
        nullable: false
        descricao: Quando o evento foi processado em Silver

  # Exemplo: tabela Silver L2 (estado atual materializado)
  - nome: silver_l2.exemplo__entidade
    camada_medalhao: Silver L2
    colunas:
      - nome: entity_id
        tipo: TEXT
        nullable: false
        chave_primaria: true
        descricao: ID da entidade

      - nome: status_atual
        tipo: TEXT
        nullable: false
        descricao: Status final (aplicada regra de precedência)

      - nome: status_timestamp
        tipo: TEXT
        nullable: false
        descricao: Timestamp do status final

      - nome: event_count
        tipo: INTEGER
        nullable: false
        descricao: Total de eventos até o status atual

  # Exemplo: tabela Gold (pronto para consumo)
  - nome: gold.analytics__exemplo_metrica
    camada_medalhao: Gold
    colunas:
      - nome: periodo
        tipo: TEXT
        nullable: false
        chave_primaria: true
        descricao: Período de agregação (YYYY-MM-DD)

      - nome: segmento
        tipo: TEXT
        nullable: false
        chave_primaria: true
        descricao: Dimensão de segmentação (ex: canal, region)

      - nome: metrica_valor
        tipo: REAL
        nullable: false
        descricao: Valor da métrica (taxa, média, contagem)

      - nome: metrica_count
        tipo: INTEGER
        nullable: false
        descricao: Quantidade de eventos agregados

      - nome: updated_at
        tipo: TEXT
        nullable: false
        descricao: Quando foi última atualização
