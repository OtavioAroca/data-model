# yaml-language-server: $schema=../_schema/catalog.schema.json
subdominio:
  nome: Limite
  bounded_context: Concede, ajusta e controla o limite de crédito disponível na conta
    cartão
  sistemas_origem: Motor de crédito/limite
  tipo_ddd: Core
produtos:
- camada: Core
  nome: core_credit_limit
  descricao: Limite concedido e histórico de alterações (aumento, redução, bloqueio)
  consumidores:
  - Compras/autorização
  - cobrança
  - Time de Performance
  dono: Time de Crédito/Limite
  status: V0 — a validar
- camada: Integration
  nome: integration_limit_utilization
  descricao: Cruza limite concedido com transações e fatura para calcular limite disponível
    em tempo real
  consumidores:
  - Autorização
  - app do cliente
  - Time de Performance
  dono: Time de Crédito/Limite
  status: V0 — a validar
- camada: Analytics
  nome: analytics_limit_policy
  descricao: Efetividade de políticas de aumento/redução de limite sobre inadimplência
    e uso
  consumidores:
  - Risco
  - crédito
  - Time de Performance
  dono: Time de Crédito/Limite
  status: V0 — a validar
