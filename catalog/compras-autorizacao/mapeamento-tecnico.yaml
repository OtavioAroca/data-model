# yaml-language-server: $schema=../_schema/mapeamento-tecnico.schema.json
contexto: Piloto de mapeamento técnico — subdomínio Compras / Autorização (Core +
  Integration).
notas:
- titulo: Correção de nomenclatura
  texto: Os 5 tópicos de status (approved/denied/cancelled/clearing/processed) alimentam
    a fonte 'purchase' (grão de compra), não 'transaction'. A fonte 'transaction'
    é outra coisa — só existe em crédito, tópico único, carrega o detalhamento de
    parcelas (grão de parcela, N por compra). Dentro de 'transaction', o ID da compra
    vem preenchido na linha da compra e nulo nas linhas de parcela — sugere mistura
    de cabeçalho e detalhe na mesma fonte, a resolver no desenho de schema físico.
- titulo: Pendências de validação
  texto: '(1) A regra de precedência de status em L2 é regra de NEGÓCIO, não dedup
    técnico por timestamp de chegada — precisa ser definida pelo time de domínio (ex:
    um cancelled deve sempre prevalecer mesmo chegando depois de um clearing?). (2)
    Se risco/fraude/atendimento também precisam do histórico completo, além do estado
    atual — hoje não confirmado. (3) Se débito tem equivalente ao tópico transaction_type
    do crédito — hoje não confirmado.'
- titulo: Produto vs. insumo interno
  texto: 'Sem consumidor externo confirmado, core_credit_transaction e core_credit_transaction_type
    não aparecem como linha própria no Catálogo V0 — continuam Core (fonte única,
    sem cruzamento de domínio), só não são produtos expostos com contrato/SLA próprio;
    são insumo interno de integration_purchase_journey. Padrão aplicado na dúvida:
    só expor como produto quando houver evidência real de consumo externo; promover
    depois se aparecer.'
