<meta charset="utf-8" />
<title>Parque de Dados — Domínio Cartão</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel-bg: #ffffff;
    --text: #1f2328;
    --text-muted: #6b7280;
    --border: #e2e2e0;
    --accent: #2563eb;
    --layer-bronze: #b45309;
    --layer-silver-l1: #64748b;
    --layer-silver-l2: #475569;
    --layer-silver: #94a3b8;
    --layer-gold: #ca8a04;
    --edge-lineage: #3b82f6;
    --edge-relacional: #c026d3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --panel-bg: #1c1f26;
      --text: #e6e8eb;
      --text-muted: #9aa1ac;
      --border: #2c313a;
      --edge-lineage: #60a5fa;
      --edge-relacional: #e879f9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --panel-bg: #1c1f26;
    --text: #e6e8eb;
    --text-muted: #9aa1ac;
    --border: #2c313a;
    --edge-lineage: #60a5fa;
    --edge-relacional: #e879f9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    flex: 0 0 auto;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--text-muted); font-size: 13px; }

  #mapa-view {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr;
  }

  .toolbar {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
  }
  .toolbar input[type="search"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    min-width: 200px;
  }
  .toolbar button.reset { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

  .filters { display: flex; gap: 8px; align-items: center; }
  .legend { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .legend-item { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .dropdown { position: relative; }
  .dropdown-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .dropdown-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 20;
    min-width: 220px;
    max-height: 280px;
    overflow-y: auto;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  .dropdown-panel[hidden] { display: none; }
  .dropdown-actions { display: flex; gap: 6px; padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .dropdown-actions button { flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 3px 6px; font-size: 11px; cursor: pointer; }
  .dropdown-option { display: flex; align-items: center; gap: 6px; padding: 3px 2px; font-size: 12px; white-space: nowrap; cursor: pointer; }

  #canvas-wrap { position: relative; overflow: hidden; background: var(--bg); cursor: grab; min-height: 0; }
  #canvas-wrap.grabbing { cursor: grabbing; }
  #canvas-wrap svg { width: 100%; height: 100%; display: block; }

  .table-card { fill: var(--panel-bg); stroke: var(--border); stroke-width: 1.5; rx: 8; }
  .table-card.selected { stroke: var(--accent); stroke-width: 2.5; }
  .table-card.dimmed { opacity: 0.25; }
  .table-card.external { fill: transparent; stroke-dasharray: 4 3; opacity: 0.6; }
  .table-title { font-size: 11px; font-weight: 600; fill: var(--text); pointer-events: none; }
  .table-sub { font-size: 9.5px; fill: var(--text-muted); pointer-events: none; }

  .edge-lineage {
    fill: none; stroke: var(--edge-lineage); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0.8; filter: drop-shadow(0 0 2px color-mix(in srgb, var(--edge-lineage) 55%, transparent));
  }
  .edge-lineage.dashflow { stroke-dasharray: 3 6; animation: dashflow 0.9s linear infinite; }
  .edge-lineage.dimmed { opacity: 0.08; filter: none; }
  @keyframes dashflow { to { stroke-dashoffset: -18; } }
  .edge-relacional {
    fill: none; stroke: var(--edge-relacional); stroke-width: 1.6; stroke-linecap: round;
    stroke-dasharray: 0.1 6.5; opacity: 0.55;
  }
  .edge-relacional.dimmed { opacity: 0.06; }
  .flow-dot { fill: var(--edge-lineage); filter: drop-shadow(0 0 3px color-mix(in srgb, var(--edge-lineage) 70%, transparent)); }

  .table-card-group { cursor: grab; }
  .expand-toggle { cursor: pointer; }
  .expand-toggle circle { fill: var(--bg); stroke: var(--border); }
  .expand-toggle path { stroke: var(--text-muted); stroke-width: 1.6; fill: none; }
  .card-columns-fo { overflow: hidden; }
  .card-columns {
    width: 100%; height: 100%;
    overflow-x: hidden; overflow-y: auto;
    box-sizing: border-box;
    padding: 2px 4px;
    font: 10.5px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--panel-bg);
  }
  .card-columns table { width: 100%; table-layout: fixed; border-collapse: collapse; }
  .card-columns td {
    padding: 2px 4px; border-bottom: 1px solid var(--border); color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-columns td:first-child { width: 62%; }
  .card-columns td:last-child { width: 38%; }
  .card-columns .pk { color: var(--layer-gold); font-weight: 700; }
  .card-columns .fk { color: var(--edge-relacional); font-weight: 700; }

  #side-panel { border-left: 1px solid var(--border); background: var(--panel-bg); overflow-y: auto; padding: 16px; }
  #side-panel h2 { font-size: 15px; margin: 0 0 2px; }
  #side-panel .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 10px; color: #fff; margin-right: 4px; }
  #side-panel table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  #side-panel th, #side-panel td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #side-panel th { color: var(--text-muted); font-weight: 600; font-size: 11px; }
  #side-panel .pk { color: var(--layer-gold); font-weight: 700; }
  #side-panel .fk { color: var(--edge-relacional); font-size: 11px; }
  #side-panel .section-title { margin-top: 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
  #side-panel .chips-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #side-panel .chip-btn { border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 3px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; }
  #side-panel .hint { color: var(--text-muted); font-size: 12px; }
</style>

<header>
  <h1>Parque de Dados — Domínio Cartão</h1>
  <p>Mapa gerado a partir de <code>catalog/</code> — tabelas, campos, relações e fluxo de pipeline de Compras/Autorização.</p>
</header>

<div id="mapa-view">
  <div class="toolbar">
    <input type="search" id="search-input" placeholder="Buscar tabela…" />

    <div class="filters" id="filters"></div>

    <div class="legend" id="legend"></div>

    <button class="reset" id="reset-view">Centralizar</button>
    <button class="reset" id="reorganize-view">Reorganizar</button>
  </div>

  <div id="canvas-wrap">
    <svg id="canvas-svg"></svg>
  </div>

  <div id="side-panel">
    <p class="hint">Clique em uma tabela para ver colunas, tipos, lineage e relações.</p>
  </div>
</div>

<script>
/*__PARQUE_DE_DADOS_DATA__*/

const LAYER_ORDER = ["Bronze", "Silver L1", "Silver L2", "Silver", "Gold"];
const LAYER_COLOR = {
  "Bronze": "var(--layer-bronze)",
  "Silver L1": "var(--layer-silver-l1)",
  "Silver L2": "var(--layer-silver-l2)",
  "Silver": "var(--layer-silver)",
  "Gold": "var(--layer-gold)",
};
const PREFIXO_PARA_CAMADA = {
  "bronze": "Bronze",
  "silver_l1": "Silver L1",
  "silver_l2": "Silver L2",
  "silver": "Silver",
  "gold": "Gold",
};

const CARD_W = 260;
const CARD_H = 56;
const HEADER_H = 40;
const EXPANDED_H = 240;
const COL_GAP = 170;
const ROW_GAP = 14;
const COL_X0 = 40;
const ROW_Y0 = 60;

const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, attrs, ...children) {
  const node = document.createElementNS(SVGNS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  for (const c of children) if (c) node.appendChild(c);
  return node;
}
function htmlEl(tag, attrs, text) {
  const node = document.createElement(tag);
  for (const k in attrs || {}) node.setAttribute(k, attrs[k]);
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---------------------------------------------------------------------
// Estado do mapa (assume o primeiro subdomínio com schema físico —
// hoje só compras-autorizacao; a estrutura já suporta mais de um)
// ---------------------------------------------------------------------
const mapa = DATA.mapas_detalhados[0];

// ?compacto=1 na URL abre as tabelas recolhidas (sem colunas) por padrão —
// usado ao embutir este mapa dentro de outra página (ver
// presentation/apresentacao-executiva.template.html). Sem o parâmetro,
// comportamento padrão inalterado (tabelas expandidas).
const COMPACTO = new URLSearchParams(location.search).has("compacto");

let nodes = [];       // {id, nome, curto, camada, tabela, externo}
let nodeById = {};
let selectedId = null;
let searchTerm = "";
let activeLayers = new Set();
let activeProdutos = new Set();
let activeCamadasProduto = new Set();
let filterHidden = new Set();

// Mesmo grafo usado para desenhar as setas de lineage, na direção
// upstream -> downstream, para propagar a ocultação por filtro.
const DOWNSTREAM_MAP = {};
for (const t of mapa.tabelas) {
  for (const upstream of t.lineage_upstream) {
    (DOWNSTREAM_MAP[upstream] = DOWNSTREAM_MAP[upstream] || []).push(t.nome);
  }
}

function computeFilterHidden() {
  const hidden = new Set();
  nodes.forEach(n => { if (!nodeActive(n)) hidden.add(n.id); });
  const queue = Array.from(hidden);
  while (queue.length) {
    const cur = queue.pop();
    (DOWNSTREAM_MAP[cur] || []).forEach(down => {
      if (!hidden.has(down)) {
        hidden.add(down);
        queue.push(down);
      }
    });
  }
  return hidden;
}

let view = { x: 0, y: 0, k: 1 };

function nomeCurto(nome) {
  const parts = nome.split(".");
  return parts.length > 1 ? parts[1] : nome;
}

function camadaDeNomeExterno(nome) {
  const prefixo = nome.split(".")[0];
  return PREFIXO_PARA_CAMADA[prefixo] || "Gold";
}

function montarNodes() {
  nodes = [];
  const porCamada = {};
  LAYER_ORDER.forEach(l => porCamada[l] = []);

  for (const t of mapa.tabelas) {
    porCamada[t.camada_medalhao] = porCamada[t.camada_medalhao] || [];
    porCamada[t.camada_medalhao].push({ id: t.nome, nome: t.nome, curto: nomeCurto(t.nome), camada: t.camada_medalhao, tabela: t, externo: false });
  }
  for (const nomeExt of mapa.tabelas_externas_lineage) {
    const camada = camadaDeNomeExterno(nomeExt);
    porCamada[camada] = porCamada[camada] || [];
    porCamada[camada].push({ id: nomeExt, nome: nomeExt, curto: nomeCurto(nomeExt), camada, tabela: null, externo: true });
  }

  LAYER_ORDER.forEach((camada, colIdx) => {
    const lista = porCamada[camada] || [];
    lista.forEach((n, rowIdx) => {
      n.x = COL_X0 + colIdx * (CARD_W + COL_GAP);
      n.y = ROW_Y0 + rowIdx * (CARD_H + ROW_GAP);
      n.gridX = n.x;
      n.gridY = n.y;
      n.expanded = !COMPACTO;
      nodes.push(n);
    });
  });

  nodeById = {};
  nodes.forEach(n => nodeById[n.id] = n);
}

function cardHeight(n) {
  return n.expanded ? EXPANDED_H : CARD_H;
}

function contentHeight() {
  let max = 0;
  nodes.forEach(n => max = Math.max(max, n.y + cardHeight(n)));
  return max + 40;
}
function contentWidth() {
  let max = COL_X0 + LAYER_ORDER.length * (CARD_W + COL_GAP);
  nodes.forEach(n => max = Math.max(max, n.x + CARD_W + 40));
  return max;
}

// ---------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------
const svg = document.getElementById("canvas-svg");
let rootG;

// Ids de todos os nós conectados a `nodeId` do lado `side` ("right" = saem
// daqui, "left" = chegam aqui), considerando lineage + relações visíveis.
// Usado para distribuir (fan-out) os pontos de ancoragem em vez de empilhar
// todas as linhas no meio do cartão.
function connectedIds(nodeId, side) {
  const ids = [];
  for (const t of mapa.tabelas) {
    for (const up of t.lineage_upstream) {
      if (side === "right" && up === nodeId && edgeVisible(up, t.nome)) ids.push(t.nome);
      if (side === "left" && t.nome === nodeId && edgeVisible(up, t.nome)) ids.push(up);
    }
  }
  for (const r of mapa.relacoes) {
    if (side === "right" && r.tabela_origem === nodeId && edgeVisible(r.tabela_origem, r.tabela_destino)) ids.push(r.tabela_destino);
    if (side === "left" && r.tabela_destino === nodeId && edgeVisible(r.tabela_origem, r.tabela_destino)) ids.push(r.tabela_origem);
  }
  return ids;
}

function edgeSlotOffset(nodeId, side, counterpartId, height) {
  const ids = Array.from(new Set(connectedIds(nodeId, side)));
  if (ids.length <= 1) return 0;
  ids.sort((x, y) => (nodeById[x] ? nodeById[x].y : 0) - (nodeById[y] ? nodeById[y].y : 0));
  const idx = ids.indexOf(counterpartId);
  const usable = Math.min(height - 28, 6 + ids.length * 13);
  const t = idx / (ids.length - 1);
  return (t - 0.5) * usable;
}

function edgePoint(node, side, offset = 0) {
  // side: 'right' (saída) ou 'left' (entrada)
  const y = node.y + cardHeight(node) / 2 + offset;
  return { x: side === "right" ? node.x + CARD_W : node.x, y };
}

// Caminho suave com cantos arredondados a partir de uma lista de pontos.
function roundedPath(points, r) {
  let d = `M ${points[0].x} ${points[0].y} `;
  for (let i = 1; i < points.length - 1; i++) {
    const prev = points[i - 1], curr = points[i], next = points[i + 1];
    const d1 = Math.hypot(curr.x - prev.x, curr.y - prev.y);
    const d2 = Math.hypot(next.x - curr.x, next.y - curr.y);
    const rr = Math.min(r, d1 / 2, d2 / 2);
    const p1 = pointTowards(curr, prev, rr);
    const p2 = pointTowards(curr, next, rr);
    d += `L ${p1.x} ${p1.y} Q ${curr.x} ${curr.y} ${p2.x} ${p2.y} `;
  }
  const last = points[points.length - 1];
  d += `L ${last.x} ${last.y}`;
  return d;
}

function pointTowards(from, to, dist) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: from.x + (dx / len) * dist, y: from.y + (dy / len) * dist };
}

function pathBetween(a, b) {
  const offA = edgeSlotOffset(a.id, "right", b.id, cardHeight(a));
  const offB = edgeSlotOffset(b.id, "left", a.id, cardHeight(b));
  const p1 = edgePoint(a, "right", offA);
  const p2 = edgePoint(b, "left", offB);

  if (b.x < a.x - 10) {
    // Referência "para trás" (cartão de destino começa à esquerda do de
    // origem — inclusive após arrastar cartões livremente): roteia por cima
    // de todas as tabelas com cantos suaves em vez de cruzar a tela na diagonal.
    const topY = Math.min(...nodes.map(n => n.y)) - 30;
    return roundedPath([
      { x: p1.x, y: p1.y },
      { x: p1.x + 24, y: p1.y },
      { x: p1.x + 24, y: topY },
      { x: p2.x - 24, y: topY },
      { x: p2.x - 24, y: p2.y },
      { x: p2.x, y: p2.y },
    ], 14);
  }
  const dx = Math.max(70, (p2.x - p1.x) / 2);
  return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
}

function render() {
  filterHidden = computeFilterHidden();
  svg.innerHTML = "";
  const defs = el("defs");
  defs.appendChild(el("marker", { id: "arrow-lineage", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
    el("path", { d: "M0.5,1 L9.5,5 L0.5,9 Q2.6,5 0.5,1 Z", fill: "var(--edge-lineage)" })));
  defs.appendChild(el("marker", { id: "arrow-relacional", viewBox: "0 0 10 10", refX: 5, refY: 5, markerWidth: 5.5, markerHeight: 5.5, orient: "auto-start-reverse" },
    el("path", { d: "M5,0.5 L9.5,5 L5,9.5 L0.5,5 Z", fill: "var(--edge-relacional)" })));
  svg.appendChild(defs);

  rootG = el("g", { id: "root-g" });
  svg.appendChild(rootG);

  renderLineageEdges();
  renderRelationalEdges();
  renderNodes();
  applyTransform();
}

function nodeActive(n) {
  if (!activeLayers.has(n.camada)) return false;
  if (n.externo) return true;
  if (!activeProdutos.has(n.tabela.produto)) return false;
  if (!activeCamadasProduto.has(n.tabela.camada_produto)) return false;
  return true;
}

function edgeVisible(nomeA, nomeB) {
  const a = nodeById[nomeA], b = nodeById[nomeB];
  if (!a || !b) return false;
  if (filterHidden.has(a.id) || filterHidden.has(b.id)) return false;
  return true;
}

function nodeMatchesSearch(n) {
  if (!searchTerm) return true;
  return n.curto.toLowerCase().includes(searchTerm) || n.nome.toLowerCase().includes(searchTerm);
}

function renderLineageEdges() {
  const g = el("g", { id: "lineage-edges" });
  let i = 0;
  for (const t of mapa.tabelas) {
    for (const upstream of t.lineage_upstream) {
      if (!edgeVisible(upstream, t.nome)) continue;
      const a = nodeById[upstream], b = nodeById[t.nome];
      const id = `lineage-${i++}`;
      const dimmed = (searchTerm && !(nodeMatchesSearch(a) || nodeMatchesSearch(b))) ? " dimmed" : "";
      const path = el("path", { id, class: "edge-lineage dashflow" + dimmed, d: pathBetween(a, b), "marker-end": "url(#arrow-lineage)", "data-from": upstream, "data-to": t.nome });
      g.appendChild(path);
      const dot = el("circle", { r: 3, class: "flow-dot" });
      const anim = el("animateMotion", { dur: (2.4 + Math.random() * 1.2).toFixed(1) + "s", repeatCount: "indefinite" });
      const mpath = el("mpath");
      mpath.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#" + id);
      anim.appendChild(mpath);
      dot.appendChild(anim);
      if (!dimmed) g.appendChild(dot);
    }
  }
  rootG.appendChild(g);
}

function renderRelationalEdges() {
  const g = el("g", { id: "relational-edges" });
  for (const r of mapa.relacoes) {
    if (!edgeVisible(r.tabela_origem, r.tabela_destino)) continue;
    const a = nodeById[r.tabela_origem], b = nodeById[r.tabela_destino];
    const dimmed = (searchTerm && !(nodeMatchesSearch(a) || nodeMatchesSearch(b))) ? " dimmed" : "";
    const d = pathBetween(a, b);
    g.appendChild(el("path", { class: "edge-relacional" + dimmed, d, "marker-end": "url(#arrow-relacional)", "data-from": r.tabela_origem, "data-to": r.tabela_destino }));
  }
  rootG.appendChild(g);
}

function renderNodes() {
  const g = el("g", { id: "nodes" });
  for (const n of nodes) {
    if (filterHidden.has(n.id)) continue;
    const dimmed = searchTerm && !nodeMatchesSearch(n);
    const selected = n.id === selectedId;
    const h = cardHeight(n);
    const group = el("g", { transform: `translate(${n.x},${n.y})`, class: "table-card-group" });
    group.appendChild(el("rect", {
      width: CARD_W, height: h,
      class: "table-card" + (selected ? " selected" : "") + (dimmed ? " dimmed" : "") + (n.externo ? " external" : ""),
      stroke: n.externo ? LAYER_COLOR[n.camada] : undefined,
    }));
    group.appendChild(el("rect", { width: 5, height: h, fill: n.externo ? "transparent" : LAYER_COLOR[n.camada], rx: 2 }));
    const title = el("text", { x: 14, y: 22, class: "table-title" }, document.createTextNode(n.curto));
    group.appendChild(title);
    if (n.externo) {
      group.appendChild(el("text", { x: 14, y: 38, class: "table-sub" }, document.createTextNode("externo — outro subdomínio")));
    } else {
      if (!n.expanded) {
        const ncols = n.tabela.colunas.length;
        const npk = n.tabela.colunas.filter(c => c.chave_primaria).length;
        const nfk = n.tabela.colunas.filter(c => c.chave_estrangeira).length;
        group.appendChild(el("text", { x: 14, y: 38, class: "table-sub" },
          document.createTextNode(`${ncols} colunas${npk ? " · PK" : ""}${nfk ? ` · ${nfk} FK` : ""}`)));
      } else {
        group.appendChild(renderCardColumns(n, h));
      }
      group.appendChild(renderExpandToggle(n));
    }
    setupNodeDrag(group, n);
    g.appendChild(group);
  }
  rootG.appendChild(g);
}

function renderExpandToggle(n) {
  const size = 16;
  const tx = CARD_W - size - 6, ty = 6;
  const toggle = el("g", { class: "expand-toggle", transform: `translate(${tx},${ty})` });
  toggle.appendChild(el("circle", { cx: size / 2, cy: size / 2, r: size / 2 }));
  const chevronD = n.expanded
    ? `M${size * 0.28},${size * 0.62} L${size * 0.5},${size * 0.38} L${size * 0.72},${size * 0.62}`
    : `M${size * 0.28},${size * 0.38} L${size * 0.5},${size * 0.62} L${size * 0.72},${size * 0.38}`;
  toggle.appendChild(el("path", { d: chevronD }));
  toggle.addEventListener("mousedown", (e) => e.stopPropagation());
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    n.expanded = !n.expanded;
    resolverColisoes();
    render();
  });
  return toggle;
}

function renderCardColumns(n, h) {
  const fo = el("foreignObject", { x: 0, y: HEADER_H, width: CARD_W, height: Math.max(0, h - HEADER_H - 6), class: "card-columns-fo" });
  const div = document.createElementNS("http://www.w3.org/1999/xhtml", "div");
  div.setAttribute("class", "card-columns");
  const rows = n.tabela.colunas.map(c => {
    const marker = c.chave_primaria ? '<span class="pk">PK</span> ' : (c.chave_estrangeira ? '<span class="fk">FK</span> ' : "");
    return `<tr><td>${marker}${c.nome}</td><td>${c.tipo}</td></tr>`;
  }).join("");
  div.innerHTML = `<table><tbody>${rows}</tbody></table>`;
  fo.appendChild(div);
  return fo;
}

function updateConnectedEdges(nodeId) {
  svg.querySelectorAll(`path[data-from="${nodeId}"], path[data-to="${nodeId}"]`).forEach(path => {
    const a = nodeById[path.getAttribute("data-from")];
    const b = nodeById[path.getAttribute("data-to")];
    if (a && b) path.setAttribute("d", pathBetween(a, b));
  });
}

function boxesOverlap(a, b) {
  const ax1 = a.x, ax2 = a.x + CARD_W, ay1 = a.y, ay2 = a.y + cardHeight(a);
  const bx1 = b.x, bx2 = b.x + CARD_W, by1 = b.y, by2 = b.y + cardHeight(b);
  return ax1 < bx2 && ax2 > bx1 && ay1 < by2 && ay2 > by1;
}

// Empurra sempre para baixo (nunca para cima) quem estiver sobrepondo outra
// caixa, para que expandir/arrastar nunca deixe cartões sobrepostos.
function resolverColisoes() {
  const MAX_ITER = 20;
  for (let iter = 0; iter < MAX_ITER; iter++) {
    let any = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = 0; j < nodes.length; j++) {
        if (i === j) continue;
        const a = nodes[i], b = nodes[j];
        if (!boxesOverlap(a, b)) continue;
        const lower = a.y <= b.y ? b : a;
        const upper = a.y <= b.y ? a : b;
        const overlapY = (upper.y + cardHeight(upper)) - lower.y;
        if (overlapY > 0) {
          lower.y += overlapY + ROW_GAP;
          any = true;
        }
      }
    }
    if (!any) break;
  }
}

function setupNodeDrag(group, n) {
  let start = null;   // {mx, my} em coordenadas de tela no mousedown
  let origin = null;  // {x, y} do nó no mousedown
  let dragging = false;

  function onMouseMove(e) {
    if (!start) return;
    const dx = (e.clientX - start.mx) / view.k;
    const dy = (e.clientY - start.my) / view.k;
    if (!dragging && Math.hypot(e.clientX - start.mx, e.clientY - start.my) > 4) {
      dragging = true;
      group.style.cursor = "grabbing";
    }
    if (!dragging) return;
    n.x = origin.x + dx;
    n.y = origin.y + dy;
    group.setAttribute("transform", `translate(${n.x},${n.y})`);
    updateConnectedEdges(n.id);
  }

  function onMouseUp() {
    window.removeEventListener("mousemove", onMouseMove);
    window.removeEventListener("mouseup", onMouseUp);
    group.style.cursor = "";
    const wasDragging = dragging;
    start = null;
    dragging = false;
    if (!wasDragging) {
      selecionarNode(n.id);
    } else {
      resolverColisoes();
      render();
    }
  }

  group.addEventListener("mousedown", (e) => {
    if (e.target.closest && e.target.closest(".card-columns")) return;
    e.stopPropagation();
    start = { mx: e.clientX, my: e.clientY };
    origin = { x: n.x, y: n.y };
    dragging = false;
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
  });
}

function applyTransform() {
  rootG.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}

// ---------------------------------------------------------------------
// Side panel
// ---------------------------------------------------------------------
function selecionarNode(id) {
  selectedId = id;
  render();
  renderSidePanel();
}

function badgeCamada(camada) {
  return `<span class="badge" style="background:${LAYER_COLOR[camada]}">${camada}</span>`;
}

function renderSidePanel() {
  const panel = document.getElementById("side-panel");
  const n = nodeById[selectedId];
  if (!n) {
    panel.innerHTML = '<p class="hint">Clique em uma tabela para ver colunas, tipos, lineage e relações.</p>';
    return;
  }
  if (n.externo) {
    panel.innerHTML = `
      <h2>${n.curto}</h2>
      ${badgeCamada(n.camada)}
      <p class="hint" style="margin-top:10px">Tabela referenciada como fonte de lineage, mas pertence a outro
      subdomínio (sem <code>schema-fisico.yaml</code> neste catálogo ainda). Nome completo:
      <code>${n.nome}</code>.</p>
    `;
    return;
  }

  const t = n.tabela;
  let colunasHtml = t.colunas.map(c => {
    const fk = c.chave_estrangeira
      ? `<div class="fk">→ ${c.chave_estrangeira.tabela}.${c.chave_estrangeira.coluna}</div>`
      : "";
    return `<tr>
      <td>${c.chave_primaria ? '<span class="pk">PK</span> ' : ""}${c.nome}</td>
      <td>${c.tipo}</td>
      <td>${c.nullable ? "sim" : "não"}</td>
      <td>${c.descricao || ""}${fk}</td>
    </tr>`;
  }).join("");

  function chipsLinks(lista, label) {
    if (!lista.length) return "";
    const btns = lista.map(nome => `<button class="chip-btn" data-goto="${nome}">${nomeCurto(nome)}</button>`).join("");
    return `<div class="section-title">${label}</div><div class="chips-list">${btns}</div>`;
  }

  const relOrigem = mapa.relacoes.filter(r => r.tabela_origem === t.nome);
  const relDestino = mapa.relacoes.filter(r => r.tabela_destino === t.nome);
  let relHtml = "";
  if (relOrigem.length || relDestino.length) {
    relHtml = '<div class="section-title">Relações</div>';
    relOrigem.forEach(r => relHtml += `<div class="hint">${r.coluna_origem} → ${nomeCurto(r.tabela_destino)}.${r.coluna_destino}</div>`);
    relDestino.forEach(r => relHtml += `<div class="hint">${nomeCurto(r.tabela_origem)}.${r.coluna_origem} → ${r.coluna_destino}</div>`);
  }

  panel.innerHTML = `
    <h2>${n.curto}</h2>
    ${badgeCamada(n.camada)}
    ${t.produto ? `<span class="badge" style="background:#374151">${t.camada_produto}: ${t.produto}</span>` : ""}
    <p class="hint" style="margin-top:8px">${t.papel || ""}</p>
    <p class="hint">Pipeline: ${t.pipeline || "—"} · Frequência: ${t.frequencia || "—"}</p>
    ${t.fonte_origem ? `<p class="hint">${t.fonte_origem}</p>` : ""}
    <table>
      <thead><tr><th>Coluna</th><th>Tipo</th><th>Nullable</th><th>Descrição / FK</th></tr></thead>
      <tbody>${colunasHtml}</tbody>
    </table>
    ${chipsLinks(t.lineage_upstream, "Lineage — vem de")}
    ${chipsLinks(t.lineage_downstream, "Lineage — alimenta")}
    ${relHtml}
  `;

  panel.querySelectorAll("[data-goto]").forEach(btn => {
    btn.addEventListener("click", () => selecionarNode(btn.getAttribute("data-goto")));
  });
}

// ---------------------------------------------------------------------
// Toolbar: busca, filtros suspensos (camada / produto / core-integration-analytics),
// toggles de aresta, pan & zoom
// ---------------------------------------------------------------------
const CAMADA_PRODUTO_ORDER = ["Core", "Integration", "Analytics"];

function distinctProdutos() {
  const vistos = new Map();
  mapa.tabelas.forEach(t => { if (t.produto) vistos.set(t.produto, t.camada_produto); });
  return Array.from(vistos.entries())
    .sort((a, b) => {
      const oa = CAMADA_PRODUTO_ORDER.indexOf(a[1]);
      const ob = CAMADA_PRODUTO_ORDER.indexOf(b[1]);
      if (oa !== ob) return oa - ob;
      return a[0].localeCompare(b[0]);
    })
    .map(([produto]) => produto);
}

function distinctCamadasProduto() {
  const presentes = new Set(mapa.tabelas.map(t => t.camada_produto).filter(Boolean));
  return CAMADA_PRODUTO_ORDER.filter(c => presentes.has(c));
}

function createDropdown(label, values, activeSet) {
  values.forEach(v => activeSet.add(v));

  const wrap = htmlEl("div", { class: "dropdown" });
  const btn = htmlEl("button", { class: "dropdown-btn", type: "button" });
  const panel = htmlEl("div", { class: "dropdown-panel" });
  panel.hidden = true;

  function updateLabel() {
    btn.textContent = `${label} (${activeSet.size}/${values.length})`;
  }

  const actions = htmlEl("div", { class: "dropdown-actions" });
  const allBtn = htmlEl("button", { type: "button" }, "Todos");
  const noneBtn = htmlEl("button", { type: "button" }, "Nenhum");
  actions.appendChild(allBtn);
  actions.appendChild(noneBtn);
  panel.appendChild(actions);

  const checkboxes = [];
  values.forEach(v => {
    const optLabel = htmlEl("label", { class: "dropdown-option" });
    const cb = htmlEl("input", { type: "checkbox" });
    cb.checked = true;
    cb.addEventListener("change", () => {
      if (cb.checked) activeSet.add(v); else activeSet.delete(v);
      updateLabel();
      render();
    });
    checkboxes.push(cb);
    optLabel.appendChild(cb);
    optLabel.appendChild(document.createTextNode(" " + v));
    panel.appendChild(optLabel);
  });

  allBtn.addEventListener("click", () => {
    values.forEach(v => activeSet.add(v));
    checkboxes.forEach(cb => cb.checked = true);
    updateLabel();
    render();
  });
  noneBtn.addEventListener("click", () => {
    activeSet.clear();
    checkboxes.forEach(cb => cb.checked = false);
    updateLabel();
    render();
  });

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    document.querySelectorAll(".dropdown-panel").forEach(p => { if (p !== panel) p.hidden = true; });
    panel.hidden = !panel.hidden;
  });
  panel.addEventListener("click", (e) => e.stopPropagation());

  updateLabel();
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  return wrap;
}

function montarFiltros() {
  const container = document.getElementById("filters");
  const presentes = LAYER_ORDER.filter(l => nodes.some(n => n.camada === l));
  container.appendChild(createDropdown("Camadas", presentes, activeLayers));
  container.appendChild(createDropdown("Produto de dados", distinctProdutos(), activeProdutos));
  container.appendChild(createDropdown("Core / Integration / Analytics", distinctCamadasProduto(), activeCamadasProduto));

  document.addEventListener("click", () => {
    document.querySelectorAll(".dropdown-panel").forEach(p => p.hidden = true);
  });
}

function montarLegenda() {
  const container = document.getElementById("legend");
  const presentes = LAYER_ORDER.filter(l => nodes.some(n => n.camada === l));
  presentes.forEach(camada => {
    const item = htmlEl("span", { class: "legend-item" });
    const swatch = htmlEl("span", { class: "legend-swatch" });
    swatch.style.background = LAYER_COLOR[camada];
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(camada));
    container.appendChild(item);
  });
}

document.getElementById("search-input").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("reset-view").addEventListener("click", centerView);
document.getElementById("reorganize-view").addEventListener("click", () => {
  nodes.forEach(n => {
    n.x = n.gridX;
    n.y = n.gridY;
    n.expanded = !COMPACTO;
  });
  resolverColisoes();
  render();
});

function centerView() {
  const wrap = document.getElementById("canvas-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const cw = contentWidth(), ch = contentHeight();
  const k = Math.min(1, Math.min(w / cw, h / ch) * 0.95);
  view = { x: (w - cw * k) / 2, y: 20, k };
  applyTransform();
}

(function setupPanZoom() {
  const wrap = document.getElementById("canvas-wrap");
  let dragging = false, last = null;
  wrap.addEventListener("mousedown", (e) => { dragging = true; last = { x: e.clientX, y: e.clientY }; wrap.classList.add("grabbing"); });
  window.addEventListener("mouseup", () => { dragging = false; wrap.classList.remove("grabbing"); });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    view.x += e.clientX - last.x;
    view.y += e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
    applyTransform();
  });
  wrap.addEventListener("wheel", (e) => {
    if (e.target.closest && e.target.closest(".card-columns")) return;
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const delta = e.deltaY < 0 ? 1.1 : 0.9;
    const newK = Math.min(3, Math.max(0.25, view.k * delta));
    view.x = mx - (mx - view.x) * (newK / view.k);
    view.y = my - (my - view.y) * (newK / view.k);
    view.k = newK;
    applyTransform();
  }, { passive: false });
})();

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
montarNodes();
resolverColisoes();
montarFiltros();
montarLegenda();
render();
window.addEventListener("resize", centerView);
setTimeout(centerView, 0);
</script>
