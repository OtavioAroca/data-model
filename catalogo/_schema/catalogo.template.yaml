# yaml-language-server: $schema=./catalogo.schema.json
# Template: copie este arquivo para catalogo/<novo-slug>/catalogo.yaml e adapte

subdominio:
  nome: "Exemplo de Subdomínio"
  bounded_context: "Descrição clara do que este bounded context resolve"
  sistemas_origem: "Sistemas de origem que alimentam este subdomínio"
  tipo_ddd: "Core"  # Valores permitidos: Core, Support, Generic

produtos:
  # Exemplo de produto Core
  - camada: "Core"
    nome: "core_exemplo_produto"  # Prefixo obrigatório: core_, integration_ ou analytics_
    descricao: "Descrição breve e clara do produto"
    consumidores:
      - "Time A"
      - "Time B"
      - "Time de Performance"
    dono: "Time Responsável"
    status: "V0 — a validar"  # Ex: V0 — a validar, V1 — validado, Em progresso

  # Exemplo de produto Integration
  - camada: "Integration"
    nome: "integration_exemplo_cruzado"
    descricao: "Produto que cruza dois ou mais bounded contexts"
    consumidores:
      - "Plataforma de Dados"
      - "Analytics"
    dono: "Time de Integração"
    status: "V0 — a validar"

  # Exemplo de produto Analytics
  - camada: "Analytics"
    nome: "analytics_exemplo_kpi"
    descricao: "Métrica ou KPI moldado para um caso de uso de consumo final"
    consumidores:
      - "Risco"
      - "Marketing"
      - "Dashboard de BI"
    dono: "Time de Analytics"
    status: "V0 — a validar"
